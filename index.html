<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fakturyo — Factures et reçus</title>
<meta name="description" content="Créez des factures et reçus professionnels en moins de 2 minutes. Gratuit, hors ligne, sans compte.">
<meta name="theme-color" content="#6d4aff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-tab="saisie" data-type="facture">
  <H3>Créez, personnalisez et gérez vos factures et devis en toute simplicité avec <H1>Fakturyo.</H1></H3>
<header class="top">
  <div class="brand"><span class="logo">F</span><b>Fakturyo</b></div>
  <span id="off" class="badge" hidden>Mode hors ligne</span>
  <button id="modeBtn" class="icon" aria-label="Basculer entre mode clair et mode sombre">
    <svg class="sun" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="moon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</header>
<nav class="tabs" aria-label="Vue"><button data-t="saisie" class="on">Saisie</button><button data-t="apercu">Aperçu</button></nav>
<main class="layout">
  <section id="form" aria-label="Saisie"></section>
  <section id="preview" aria-label="Aperçu du document">
    <p class="hint">Aperçu en direct — format A4</p>
    <div id="pvBox"></div>
  </section>
</main>
<footer class="sig"><b>Créé par Hanane AHOUANDJINOU | Le Magicien des Pixels</b>Vos données restent sur votre appareil : rien n’est envoyé sur un serveur.</footer>
<div class="bar">
  <button class="btn pr" data-act="pdf">Télécharger en PDF</button>
  <button class="btn" data-act="png">Image</button>
  <button class="btn" data-act="print">Imprimer</button>
  <button class="btn" data-act="share">Partager</button>
</div>
<div id="toast" role="status"></div>
<div id="printRoot"></div>
<script src="vendor/html2canvas.min.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
